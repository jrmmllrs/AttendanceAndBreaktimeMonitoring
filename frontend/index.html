<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RR Management</title>
    <meta
      name="description"
      content="Warehouse RCS - RR Management: attendance, breaktime monitoring and rcs - rr records."
    />

    <!-- Internal system: keep out of search engines -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Brand -->
    <meta name="theme-color" content="#1D63D6" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7fafe;
      }

      /* Splash shown until React mounts and replaces #root's contents */
      .boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        color: #0b3a8c;
      }

      .boot-ribbon {
        display: flex;
        width: 160px;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
      }

      .boot-ribbon span:first-child {
        width: 40px;
        background: #c8102e;
      }

      .boot-ribbon span:last-child {
        flex: 1;
        background: #1d63d6;
      }

      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e3eaf5;
        border-top-color: #1d63d6;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot p {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-ribbon"><span></span><span></span></div>
        <div class="boot-spinner"></div>
        <p>Loading Warehouse RCS - RR Management...</p>
      </div>
    </div>

    <noscript>
      Warehouse RCS - RR Management needs JavaScript enabled to run.
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
